name: zilong-gateway
services:
  parent:
    build:
      context: ..
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
    env_file:
      - ../.env.parent
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      GATEWAY_ROLE: central
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/public/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  gator:
    build: ../gator
    env_file:
      - ../gator/.env
    environment:
      GATOR_HOST: 0.0.0.0
      GATOR_PORT: 20128
    ports:
      - "127.0.0.1:20128:20128"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:20128/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  https:
    image: caddy:2-alpine
    profiles: [https]
    environment:
      PANEL_HOST: ${PANEL_HOST:-panel.invalid}
      API_HOST: ${API_HOST:-api.invalid}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      parent: { condition: service_healthy }
      gator: { condition: service_healthy }
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  ip-check:
    image: caddy:2-alpine
    profiles: [ip-check]
    ports: ["80:80"]
    volumes:
      - ./Caddyfile.ip:/etc/caddy/Caddyfile:ro
    depends_on:
      parent: { condition: service_healthy }
      gator: { condition: service_healthy }
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
