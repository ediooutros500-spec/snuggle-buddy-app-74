server {
    listen 80;
    server_name api.delvertokens.store;
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        allow all;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.delvertokens.store;
    ssl_certificate /www/sites/api.delvertokens.store/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/api.delvertokens.store/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    client_max_body_size 2m;

    # The API entry only permits inference, health and remix registration paths.
    # Administrative paths are denied by the API entry, even with an admin token.
    location / {
        proxy_pass http://127.0.0.1:4431;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_connect_timeout 15s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
